[package]
name = "misskey-ltl-stream"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.3"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }
futures = "0.3.31"
futures-util = "0.3.31"
async-stream = "0.3.6"
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = "0.4.40"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["time"] }
clap = { version = "4.5.35", features = ["derive", "env"] }
dotenv = "0.15.0"
once_cell = "1.21.3"
time = { version = "0.3.41", features = ["macros", "formatting"] }